name: denpa
services:
  genkan:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine@sha256:3e6cf4a6382da0cd14108a69929d7f8cc59e9a59cae4c9795071fa392ffa8036
    restart: unless-stopped
    environment:
      CADDY_INGRESS_NETWORKS: genkan
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy-data:/data
    networks:
      genkan:
        ipv4_address: 172.30.0.2 # denpa's TRUSTED_PROXIES
    ports:
      # IPv4 only
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    labels:
      com.getarcaneapp.arcane.updater: "false"
      caddy.default_sni: 192.168.100.23
      caddy_2: https://grafana.npi01.home.arpa
      caddy_2.tls: internal
      caddy_2.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_2.respond: "@outside 403"
      caddy_2.reverse_proxy: 172.30.0.1:3000
      caddy_3: https://arcane.npi01.home.arpa
      caddy_3.tls: internal
      caddy_3.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_3.respond: "@outside 403"
      caddy_3.reverse_proxy: 172.30.0.1:3552
      caddy_4: https://prometheus.npi01.home.arpa
      caddy_4.tls: internal
      caddy_4.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_4.respond: "@outside 403"
      caddy_4.reverse_proxy: 172.30.0.1:9090
  tuner-agent:
    image: ghcr.io/danything/denpa-agent:2.49.0@sha256:f3fd138475dd56a29d37dfa4df523c8d0490c549b19c618137370a68776996e2
    restart: unless-stopped
    stop_grace_period: 6h5m
    cap_add:
      - SYS_RESOURCE
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 212:* rmw"
    environment:
      AGENT_PAIR_TOKEN: "${AGENT_PAIR_TOKEN:?set AGENT_PAIR_TOKEN in the Git sync's Environment Variables in Arcane}"
    volumes:
      - /mnt/hdd1/denpa/config:/config
      - /mnt/hdd1/denpa/raw:/media/raw
      - /dev/bus/usb:/dev/bus/usb
      - /dev/dvb:/dev/dvb
    ports:
      - "127.0.0.1:25252:25252"
    labels:
      com.getarcaneapp.arcane.updater: "false"
  denpa:
    image: ghcr.io/danything/denpa:2.49.0@sha256:7f62dc3bfd2b05ad3dea2a850350f40b91e71528e962bf33d296c43057bd3169
    restart: unless-stopped
    stop_grace_period: 6h5m
    depends_on:
      - tuner-agent
    environment:
      TZ: Asia/Tokyo
      TUNER_AGENT_URL: "https://tuner-agent:25252#pair=${AGENT_PAIR_TOKEN:?set AGENT_PAIR_TOKEN in the Git sync's Environment Variables in Arcane}"
      TRUSTED_NETWORKS: 192.168.0.0/16,10.0.0.0/8,100.64.0.0/10
      TRUSTED_PROXIES: 172.30.0.2
      ENCODE_CONCURRENCY: "1"
    devices:
      - /dev/mpp_service:/dev/mpp_service
      - /dev/dma_heap:/dev/dma_heap
    security_opt:
      - apparmor=docker-denpa
      - systempaths=unconfined
    volumes:
      - denpa-data:/data
      - /mnt/hdd1/denpa/raw:/media/raw
      - /mnt/hdd1/denpa/encoded:/media/encoded
    labels:
      com.getarcaneapp.arcane.updater: "false"
      caddy_0: https://npi01, https://npi01.local, https://npi01.home.arpa, https://192.168.100.23
      caddy_0.tls: internal
      caddy_0.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_0.respond: "@outside 403"
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: http://npi01, http://npi01.local, http://npi01.home.arpa, http://192.168.100.23
      caddy_1.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_1.respond: "@outside 403"
      caddy_1.reverse_proxy: "{{upstreams 3000}}"
    networks: [default, genkan]
volumes:
  denpa-data:
  caddy-data:
networks:
  genkan:
    name: genkan
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25 # keeps 172.30.0.2 free for genkan
