# https://github.com/danything/denpa/blob/main/compose.prod.yml, with the NanoPi's changes merged in.
name: denpa
services:
  # genkan's proxy (https://github.com/danything/genkan/blob/main/compose.yml), without Arcane
  genkan:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine@sha256:3e6cf4a6382da0cd14108a69929d7f8cc59e9a59cae4c9795071fa392ffa8036
    restart: unless-stopped
    environment:
      CADDY_INGRESS_NETWORKS: genkan
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy-data:/data
      # Caddy gets *.ts.net certificates from tailscaled; the directory, as tailscaled recreates the socket
      - /var/run/tailscale:/var/run/tailscale
    networks:
      genkan:
        ipv4_address: 172.30.0.2 # denpa's TRUSTED_PROXIES
    ports:
      # IPv4 only
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    labels:
      # Global option: IP clients send no SNI, and after DNAT the local address is 172.30.0.2
      caddy.default_sni: 192.168.100.23
  tuner-agent:
    image: ghcr.io/danything/denpa-agent:2.29.0@sha256:9e0d81a3e6da59f253a2e08951ff07e4085eac299936adc740ff91b4e898b3c6
    restart: unless-stopped
    stop_grace_period: 6h5m
    cap_add:
      - SYS_RESOURCE
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 212:* rmw"
    environment:
      # compose/.env, written by the pre-packages hook in conf.d/nanopi
      AGENT_PAIR_TOKEN: "${AGENT_PAIR_TOKEN:?compose/.env must set AGENT_PAIR_TOKEN}"
    volumes:
      - /mnt/hdd1/denpa/config:/config
      - /mnt/hdd1/denpa/raw:/media/raw
      - /dev/bus/usb:/dev/bus/usb
      - /dev/dvb:/dev/dvb
    ports:
      - "127.0.0.1:25252:25252"
  denpa:
    image: ghcr.io/danything/denpa:2.29.0@sha256:61b48c0c105dc0fc5aae057c9f321a50bb043c4e6a74bf7235478f525a9aca0c
    restart: unless-stopped
    stop_grace_period: 6h5m
    depends_on:
      - tuner-agent
    environment:
      TZ: Asia/Tokyo
      TUNER_AGENT_URL: "https://tuner-agent:25252#pair=${AGENT_PAIR_TOKEN:?compose/.env must set AGENT_PAIR_TOKEN}"
      TRUSTED_NETWORKS: 192.168.0.0/16,10.0.0.0/8,100.64.0.0/10
      TRUSTED_PROXIES: 172.30.0.2
      ALLOWED_HOSTS: npi01.tailce43f5.ts.net # login-free names besides IPs, npi01 and npi01.local
      ENCODE_CONCURRENCY: "1"
    # Rockchip MPP
    devices:
      - /dev/mpp_service:/dev/mpp_service
      - /dev/dma_heap:/dev/dma_heap
    security_opt:
      - apparmor=docker-denpa
      - systempaths=unconfined
    volumes:
      - denpa-data:/data # denpa_denpa-data
      - /mnt/hdd1/denpa/raw:/media/raw
      - /mnt/hdd1/denpa/encoded:/media/encoded
    labels:
      # HTTPS with Caddy's internal CA; HTTP stays (no redirect) for clients without its root.
      # Separate blocks: genkan's default_sni adds TLS policies, which Caddy rejects on the :80 server.
      # caddy_N, not caddy: genkan's global caddy.* labels would merge into it.
      caddy_0: https://npi01, https://npi01.local, https://npi01.home.arpa, https://192.168.100.23
      caddy_0.tls: internal
      caddy_0.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_0.respond: "@outside 403"
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: http://npi01, http://npi01.local, http://npi01.home.arpa, http://192.168.100.23
      caddy_1.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_1.respond: "@outside 403"
      caddy_1.reverse_proxy: "{{upstreams 3000}}"
      # Let's Encrypt certificate from tailscaled; HTTP redirects to HTTPS
      caddy_2: npi01.tailce43f5.ts.net
      caddy_2.@outside: not remote_ip private_ranges 100.64.0.0/10
      caddy_2.respond: "@outside 403"
      caddy_2.reverse_proxy: "{{upstreams 3000}}"
    networks: [default, genkan]
volumes:
  denpa-data:
  caddy-data:
networks:
  genkan:
    name: genkan
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25 # keeps 172.30.0.2 free for genkan
