[bootstrap.files."~/.local/state/mise-bootstrap/guard"]
os = "unix"
source = "guard.tera"
template = true
remove_empty = true

[bootstrap.repos]
"~/.local/share/zsh/plugins/pure" = { url = "https://github.com/sindresorhus/pure" }
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.local/share/zsh/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions" }
"~/.local/share/zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting" }
"~/.local/share/zsh/plugins/history-search-multi-word" = { url = "https://github.com/zdharma-continuum/history-search-multi-word" }
"~/.local/share/zsh/plugins/zsh-history-substring-search" = { url = "https://github.com/zsh-users/zsh-history-substring-search" }
"~/.local/share/awesome-nano-syntax-highlighting" = { url = "https://github.com/eggplants/awesome-nano-syntax-highlighting" }

[bootstrap.mise_shell_activate]
zsh = true
bash = true

[dotfiles]
"~/.zshenv" = { source = "dotfiles/zshenv" }
"~/.zshrc" = { source = "dotfiles/zshrc" }
"~/.nanorc" = { source = "dotfiles/nanorc" }
"~/.gitconfig" = { source = "dotfiles/gitconfig", variants = [{ profile = "macos" }, { profile = "termux" }, { profile = "ubuntu" }] }
"~/.claude/skills/commit/SKILL.md" = { source = "dotfiles/claude/skills/commit/SKILL.md", variants = [{ profile = "macos" }, { profile = "termux" }, { profile = "ubuntu" }] }

[dotfiles."~/.local/state/mise-bootstrap/dotfiles-guard"]
source = "guard.tera"
mode = "template"

[tasks.bootstrap]
description = "No platform selected"
run = "echo 'mise-bootstrap: no platform env selected; run: bash ~/.config/mise/docs/bootstrap.sh' >&2; exit 1"
run_windows = "echo mise-bootstrap: no platform env selected; run: ~/.config/mise/docs/bootstrap.ps1 1>&2 & exit /b 1"
