[settings]
cargo.binstall = false
use_file_shell_for_executable_tasks = true
write_targets.tools = "~/.config/mise/conf.d/termux/mise.termux.toml"
write_targets.packages = "~/.config/mise/conf.d/termux/mise.termux.toml"
write_targets.dotfiles = "~/.config/mise/conf.d/termux/mise.termux.toml"

[tools]
"cargo:termscp" = "latest"
# built with go from pkg (golang); the prebuilt linux binary targets glibc
"go:github.com/azu/dockerfile-pin" = "latest"
"pipx:claude-statusbar" = "latest"

# "pkg:" is the Termux package manager plugin in plugins/pkg (repo root), linked by bootstrap.sh
[bootstrap.packages]
"pkg:android-tools" = "latest"
"pkg:ca-certificates" = "latest"
"pkg:cmake" = "latest"
"pkg:curl" = "latest"
"pkg:dbus" = "latest"
"pkg:ffmpeg" = "latest"
"pkg:git" = "latest"
"pkg:gnupg" = "latest"
"pkg:glibc-repo" = "latest"
# glibc loader and patchelf for the linux-arm64 claude binary (setup:claude-code)
"pkg:glibc-runner" = "latest"
"pkg:golang" = "latest"
"pkg:gh" = "latest"
"pkg:imagemagick" = "latest"
"pkg:jq" = "latest"
"pkg:make" = "latest"
"pkg:nano" = "latest"
"pkg:patchelf-glibc" = "latest"
"pkg:perl" = "latest"
"pkg:pinentry" = "latest"
"pkg:pkg-config" = "latest"
"pkg:python" = "latest"
"pkg:ripgrep" = "latest"
"pkg:rust" = "latest"
"pkg:samba" = "latest"
"pkg:termux-api" = "latest"
"pkg:unar" = "latest"
"pkg:uv" = "latest"
"pkg:which" = "latest"
"pkg:wget" = "latest"
"pkg:w3m" = "latest"
"pkg:zsh" = "latest"

[bootstrap.hooks]
pre-tools = "mise -E {{ mise_env | join(sep=\",\") }} bootstrap packages apply --yes"

[dotfiles]
"~/.hushlogin" = { source = "dotfiles/hushlogin" }
"~/.gnupg/gpg-agent.conf" = { source = "dotfiles/gnupg/gpg-agent.conf", mode = "copy", permissions = "0600" }

[tasks.bootstrap]
description = "Run imperative setup steps after the declarative bootstrap"
depends = ["host:check"]
run = [{ task = "setup:shell" }, { task = "setup:storage" }, { task = "setup:gpg" }, { task = "setup:git" }, { task = "setup:claude-code" }, { task = "setup:claude" }]

[task_config]
includes = ["tasks", "../../shared/tasks/gpg", "../../shared/tasks/claude"]
