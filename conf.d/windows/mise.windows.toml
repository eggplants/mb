"winget:Microsoft.VisualStudio.2022.Community" = "latest"
"winget:Microsoft.VisualStudioCode" = "latest"
"winget:Microsoft.WingetCreate" = "latest"
"winget:Python.Launcher" = "latest"
"winget:Python.Python.3.10" = "latest"
# runtimes
"winget:Microsoft.DotNet.DesktopRuntime.6" = "latest"
"winget:Microsoft.VCRedist.2008.x64" = "latest"
"winget:Microsoft.VCRedist.2008.x86" = "latest"
"winget:Microsoft.VCRedist.2010.x64" = "latest"
"winget:Microsoft.VCRedist.2010.x86" = "latest"
"winget:Microsoft.VCRedist.2012.x64" = "latest"
"winget:Microsoft.VCRedist.2012.x86" = "latest"
"winget:Microsoft.VCRedist.2013.x64" = "latest"
"winget:Microsoft.VCRedist.2013.x86" = "latest"
"winget:Microsoft.VCRedist.2015+.x64" = "latest"
"winget:Microsoft.VCRedist.2015+.x86" = "latest"
