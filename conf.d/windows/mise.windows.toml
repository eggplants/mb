"winget:Google.ChromeRemoteDesktopHost" = "latest"
"winget:Google.GoogleDrive" = "latest"
"winget:Maxon.CinebenchR23" = "latest"
"winget:Microsoft.Edge" = "latest"
"winget:Microsoft.OneDrive" = "latest"
"winget:Microsoft.Teams" = "latest"
"winget:mpv.net" = "latest"
"winget:OBSProject.OBSStudio" = "latest"
