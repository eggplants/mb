[settings]
minimum_release_age = "7d"
write_targets.tools = "~/.config/mise/conf.d/windows/mise.windows.toml"
write_targets.packages = "~/.config/mise/conf.d/windows/mise.windows.toml"
write_targets.dotfiles = "~/.config/mise/conf.d/windows/mise.windows.toml"

[tools]
ripgrep = "latest"
"aqua:azu/dockerfile-pin" = "latest"
# uv is the backend for pipx: tools
uv = "latest"
# https://github.com/leeguooooo/claude-code-usage-bar/issues/83
"pipx:claude-statusbar" = "3.53.1"

[bootstrap.packages]
"winget:Git.Git" = "latest"
"winget:jdx.mise" = "latest"
"winget:Microsoft.PowerShell" = "latest"
# shell and terminal
"winget:JanDeDobbeleer.OhMyPosh" = "latest"
"winget:Microsoft.WindowsTerminal" = "latest"
# development
"winget:Anthropic.ClaudeCode" = "latest"
"winget:Docker.DockerDesktop" = "latest"
"winget:GitHub.cli" = "latest"
"winget:Microsoft.VisualStudio.2022.Community" = "latest"
"winget:Microsoft.VisualStudioCode" = "latest"
"winget:Microsoft.WingetCreate" = "latest"
"winget:Python.Launcher" = "latest"
"winget:Python.Python.3.10" = "latest"
# runtimes
"winget:Microsoft.DotNet.DesktopRuntime.6" = "latest"
"winget:Microsoft.VCRedist.2008.x64" = "latest"
"winget:Microsoft.VCRedist.2008.x86" = "latest"
"winget:Microsoft.VCRedist.2010.x64" = "latest"
"winget:Microsoft.VCRedist.2010.x86" = "latest"
"winget:Microsoft.VCRedist.2012.x64" = "latest"
"winget:Microsoft.VCRedist.2012.x86" = "latest"
"winget:Microsoft.VCRedist.2013.x64" = "latest"
"winget:Microsoft.VCRedist.2013.x86" = "latest"
"winget:Microsoft.VCRedist.2015+.x64" = "latest"
"winget:Microsoft.VCRedist.2015+.x86" = "latest"
"winget:Nvidia.PhysX" = "latest"
# apps
"winget:CometNetwork.BitComet" = "latest"
"winget:CrystalDewWorld.CrystalDiskInfo" = "latest"
"winget:Google.Chrome" = "latest"
"winget:Google.ChromeRemoteDesktopHost" = "latest"
"winget:Google.GoogleDrive" = "latest"
"winget:Maxon.CinebenchR23" = "latest"
"winget:Microsoft.Edge" = "latest"
"winget:Microsoft.OneDrive" = "latest"
"winget:mpv.net" = "latest"
"winget:OBSProject.OBSStudio" = "latest"
"winget:Piriform.Speccy" = "latest"
"winget:PPSSPPTeam.PPSSPP" = "latest"
"winget:QNAP.QfinderPro" = "latest"
"winget:Valve.Steam" = "latest"
"winget:yt-dlp.FFmpeg" = "latest"
"winget:yt-dlp.yt-dlp" = "latest"
# Microsoft Store (msstore source)
"winget:9P8JQ0JJSTLL" = "latest"  # Kindle
"winget:XPDM1ZW6815MQM" = "latest"  # VLC

# no zsh on Windows; the bash block stays for Git Bash (and Claude Code's Bash tool)
[bootstrap.mise_shell_activate]
zsh = false

[tasks.bootstrap]
description = "Run imperative setup steps after the declarative bootstrap"
depends = ["host:check"]
run = [{ task = "setup:pwsh" }, { task = "setup:nano" }, { task = "setup:gpg" }, { task = "setup:git" }, { task = "setup:claude" }]

[task_config]
includes = ["tasks"]
