# NanoPi R6S TV server (Debian 12 bookworm, arm64). Loads after conf.d/linux (apt base,
# Docker repository key, login shell).

[settings]
write_targets.tools = "~/.config/mise/conf.d/nanopi/mise.nanopi.toml"
write_targets.packages = "~/.config/mise/conf.d/nanopi/mise.nanopi.toml"
write_targets.dotfiles = "~/.config/mise/conf.d/nanopi/mise.nanopi.toml"

[tools]
python = "latest"
lazydocker = "latest"
ripgrep = "latest"
"aqua:azu/dockerfile-pin" = "latest"

[bootstrap.packages]
"apt:dialog" = "latest"
"apt:jq" = "latest"
"apt:locales" = "latest"
"apt:fuse-overlayfs" = "latest"
"apt:openssh-server" = "latest"
"apt:avahi-daemon" = "latest"
"apt:tailscale" = "latest"
"apt:gcc" = "latest"
"apt:python3-dev" = "latest"
"apt:lshw" = "latest"
"apt:prometheus" = "latest"
"apt:prometheus-node-exporter" = "latest"
"apt:grafana-enterprise" = "latest"
"apt:nftables" = "latest"  # [bootstrap.linux.firewall]

[bootstrap.hooks]
# Arcane's encryption key (compose/arcane/compose.yaml). Losing it loses the secrets Arcane
# stores (the denpa Git sync's AGENT_PAIR_TOKEN, Git credentials), so it is never rewritten.
pre-packages = """
[ -s "$HOME/.config/mise/compose/arcane/.env" ] || (umask 077; echo "ARCANE_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\\n')" > "$HOME/.config/mise/compose/arcane/.env")
"""

# apt sources

# The suite follows /etc/os-release, so a release upgrade (sed to the new codename, then
# full-upgrade) is not reverted by the next bootstrap. os = "linux": exec() must never render
# on another OS (plan there would fail).
[bootstrap.files."/etc/apt/sources.list"]
os = "linux"
template = true
phase = "pre-packages"
content = """
{% set c = exec(command=". /etc/os-release && echo $VERSION_CODENAME") -%}
deb http://ftp.jp.debian.org/debian {{ c }} main contrib non-free
deb-src http://ftp.jp.debian.org/debian {{ c }} main contrib non-free
deb http://security.debian.org/debian-security {{ c }}-security main contrib non-free
deb-src http://security.debian.org/debian-security {{ c }}-security main contrib non-free
deb http://ftp.jp.debian.org/debian {{ c }}-updates main contrib non-free
deb-src http://ftp.jp.debian.org/debian {{ c }}-updates main contrib non-free
"""

# Written by the Tailscale install script / the old manual setup; replaced by the .sources
# files below (a different Signed-By makes apt fail). conf.d/linux removes docker.list.
[bootstrap.files."/etc/apt/sources.list.d/tailscale.list"]
state = "absent"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/grafana.list"]
state = "absent"
phase = "pre-packages"

[bootstrap.files."/etc/apt/keyrings/tailscale.asc"]
source = "files/apt/tailscale.asc"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/tailscale.sources"]
os = "linux"
template = true
phase = "pre-packages"
content = """
Types: deb
URIs: https://pkgs.tailscale.com/stable/debian
Suites: {{ exec(command=". /etc/os-release && echo $VERSION_CODENAME") }}
Components: main
Architectures: arm64
Signed-By: /etc/apt/keyrings/tailscale.asc
"""

[bootstrap.files."/etc/apt/keyrings/grafana.asc"]
source = "files/apt/grafana.asc"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/grafana.sources"]
phase = "pre-packages"
content = """
Types: deb
URIs: https://apt.grafana.com
Suites: stable
Components: main
Architectures: arm64
Signed-By: /etc/apt/keyrings/grafana.asc
"""

# system

[bootstrap.files."/etc/locale.gen"]
content = """
en_US.UTF-8 UTF-8
ja_JP.UTF-8 UTF-8
"""

# Debian 13 makes /etc/default/locale a symlink to it
[bootstrap.files."/etc/locale.conf"]
content = "LANG=en_US.UTF-8\n"

[bootstrap.files."/etc/ssh/sshd_config.d/10-no-password.conf"]
content = "PasswordAuthentication no\n"
notify = ["ssh"]

# denpa's tuner agent drives the PX-W3U4 over libusb; px4_drv would hold the device
[bootstrap.files."/etc/modprobe.d/blacklist-px4_drv.conf"]
content = "blacklist px4_drv\n"

[bootstrap.files."/etc/udev/rules.d/90-hdd1.rules"]
content = """
ACTION=="add", SUBSYSTEM=="scsi", ENV{DEVTYPE}=="scsi_device", ATTRS{idVendor}=="174c", ATTRS{idProduct}=="225c", \\
  ATTR{timeout}="180"
"""

# the denpa container's AppArmor profile (compose/denpa/compose.yaml)
[bootstrap.files."/etc/apparmor.d/docker-denpa"]
source = "files/apparmor/docker-denpa"
notify = ["apparmor"]

[bootstrap.files."/etc/docker/daemon.json"]
content = """
{"storage-driver": "fuse-overlayfs"}
"""
notify = ["docker"]

# Prometheus (Debian's default config scrapes node-exporter as job "node") for the
# Node Exporter Full dashboard
[bootstrap.files."/etc/grafana/provisioning/datasources/prometheus.yaml"]
content = """
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
"""
notify = ["grafana-server"]

# denpa's config (tuners, channels) and recordings; its database is the volume denpa_denpa-data
[bootstrap.directories."/mnt/hdd1/denpa/config"]

[bootstrap.directories."/mnt/hdd1/denpa/raw"]

[bootstrap.directories."/mnt/hdd1/denpa/encoded"]

[bootstrap.services.ssh]
state = "running"
enabled = true

[bootstrap.services.avahi-daemon]
state = "running"
enabled = true

[bootstrap.services.tailscaled]
state = "running"
enabled = true

# oneshot: loads /etc/apparmor.d; restarted when docker-denpa changes
[bootstrap.services.apparmor]
state = "running"
enabled = true

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.prometheus]
state = "running"
enabled = true

[bootstrap.services.prometheus-node-exporter]
state = "running"
enabled = true

[bootstrap.services.grafana-server]
state = "running"
enabled = true

# Grafana, Prometheus and Arcane are reached through genkan (compose/denpa) at
# <name>.npi01.home.arpa, so their ports refuse everyone else, LAN and tailnet alike (the tailnet
# resolves home.arpa by split DNS and reaches the LAN through a subnet router). Allows and
# rejects apply in this order; anything else is allowed. Without genkan, use
# `ssh -L 3552:localhost:3552 npi01.local` (loopback is always allowed).
[bootstrap.linux.firewall]
backend = "nftables"
default_incoming = "allow"
rules = [
  { name = "genkan", source = "172.30.0.0/24" },
  { name = "grafana", action = "reject", protocol = "tcp", port = 3000 },
  { name = "prometheus", action = "reject", protocol = "tcp", port = 9090 },
  { name = "node-exporter", action = "reject", protocol = "tcp", port = 9100 },
  { name = "arcane", action = "reject", protocol = "tcp", port = 3552 },
]

# Arcane, which deploys denpa, its tuner agent and genkan's proxy (compose/denpa) by Git sync.
# The files, directories and services above are denpa's host side and stay here.

[bootstrap.compose.arcane]
project_dir = "{{ xdg_config_home }}/mise/compose/arcane"
project_name = "arcane"
pull = "missing"  # Arcane updates its own :latest image
sudo = true  # the user may not be in the docker group yet
depends_on = [
  "package:apt:docker-compose-plugin",
  "service:docker",
  "file:/etc/docker/daemon.json",
  "service:apparmor",
]

[dotfiles]
"~/.ssh/authorized_keys" = { source = "files/ssh/authorized_keys", mode = "copy", permissions = "0600" }

[tasks.bootstrap]
description = "Run imperative setup steps after the declarative bootstrap"
depends = ["host:check"]
run = [{ task = "setup:system" }, { task = "setup:docker" }]

[task_config]
includes = ["tasks"]
